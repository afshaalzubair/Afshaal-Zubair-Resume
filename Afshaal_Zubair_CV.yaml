      - name: Foundation Plate
        date: '[Github Repo](https://github.com/afshaalzubair/foundation-plate)'
        highlights:
          - Formulated a mixed-integer menu model (PuLP/CBC) that fills 28 meals from 27 USDA Foundation Foods, holding each day within 10% of a calorie target and at least 95% of a protein target under a weekly grocery budget.
          - Built a Next.js and FastAPI planner that sets targets from body stats and training days, supports food swaps and price edits, and shows remaining gaps against adult intakes for fiber, iron, potassium, calcium, and magnesium.
          - Aggregated 4.06 million OpenPowerlifting meet rows to one best total per lifter (420,954 lifters) and compared the user’s body weight with IPF class medians for squat, bench, deadlift, and total.
      - name: Conway's Conundrum
        date: '[Github Repo](https://github.com/afshaalzubair/conways-game-of-life)'
        highlights:
          - A twist on the famous cellular automaton "Conway's Game of Life", which allows the user to experiment with a wide variety of custom parameters to create novel simulations.
          - Built in Python using the Pygame library.
