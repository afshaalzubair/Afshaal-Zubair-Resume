        highlights:
          - Modeled the NHTSA FARS 2023 fatal-crash files in DuckDB and wrote SQL marts with multi-table joins, CTEs, and window functions for 6,367 motorcyclists killed in 6,275 crashes, matching the published helmet split of 4,018 used, 2,124 not used, and 225 unknown.
